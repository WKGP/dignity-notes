<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://dignity-notes-relay.workgroup-works.workers.dev; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="theme-color" content="#5B3F8C">
<title>Dignity Notes user manual</title>
<meta name="description" content="Step-by-step guide to Dignity Notes for carers and administrators, with screenshots.">
<meta name="copyright" content="© 2026 Workgroup (WA) Pty Ltd">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Same palette and type as the app, so the manual feels like part of it. */
:root{
  --ground:#F7F5FA; --surface:#FFFFFF; --surface-2:#EFEBF5; --ink:#231B33; --ink-2:#5E5670; --line:#E2DCEB;
  --accent:#5B3F8C; --accent-ink:#FFFFFF; --accent-soft:#ECE5F6; --record:#D6455D;
  --incident:#B3261E; --incident-soft:#FBE4E1; --follow:#8A5D00; --follow-soft:#FBF0D9;
  --shadow:0 1px 2px rgba(35,27,51,.06),0 6px 20px rgba(35,27,51,.08);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif; color-scheme:light;
}
.ask{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin:0 0 22px;display:grid;gap:10px}
.ask label{font-weight:700;font-family:var(--f-display)}
.ask form{display:flex;gap:8px}
.ask input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--ground);color:var(--ink)}
.ask button{font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.ask button:disabled{opacity:.6;cursor:default}
.hits{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.hits a{display:block;padding:8px 10px;border-radius:10px;background:var(--surface-2);color:var(--ink);text-decoration:none}
.hits a strong{display:block;color:var(--accent)}
.hits .snip{font-size:14px;color:var(--ink-2)}
.answer{border-left:4px solid var(--accent);padding:4px 0 4px 12px;white-space:pre-line}
.answer .src{white-space:normal;font-size:14px;color:var(--ink-2);margin-top:6px}
.ask .note{font-size:13px;color:var(--ink-2);margin:0}
mark{background:#FFE08A;color:#231B33;border-radius:3px;padding:0 2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#15111C; --surface:#1E1828; --surface-2:#2A2236; --ink:#EDE8F4; --ink-2:#A79EB8; --line:#352C42;
  --accent:#B79AE8; --accent-ink:#1A1325; --accent-soft:#2E2342; --record:#F07A8E;
  --incident:#F28B82; --incident-soft:#3B1D1B; --follow:#E2B550; --follow-soft:#382D14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#15111C; --surface:#1E1828; --surface-2:#2A2236; --ink:#EDE8F4; --ink-2:#A79EB8; --line:#352C42;
  --accent:#B79AE8; --accent-ink:#1A1325; --accent-soft:#2E2342; --record:#F07A8E;
  --incident:#F28B82; --incident-soft:#3B1D1B; --follow:#E2B550; --follow-soft:#382D14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--ground);color:var(--ink);font:17px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em;text-wrap:balance;margin:0}
a{color:var(--accent);font-weight:600}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.top img{height:34px;width:auto;border-radius:8px}
.top strong{font-family:var(--f-display);font-size:18px;flex:1}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);text-decoration:none;border-radius:10px;padding:8px 14px;font-size:15px}
.layout{max-width:1080px;margin:0 auto;padding:24px 16px 80px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px}
nav.toc{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;font-size:15px}
nav.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
nav.toc a{display:block;padding:5px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
nav.toc a:hover{background:var(--surface-2);color:var(--ink)}
nav.toc .grp{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:14px 10px 4px}
main{min-width:0}
.hero{display:grid;gap:10px;margin-bottom:28px}
.hero h1{font-size:clamp(32px,5vw,44px);line-height:1.1}
.hero p{margin:0;color:var(--ink-2);font-size:19px;max-width:60ch}
.callout{background:var(--follow-soft);border-left:4px solid var(--follow);border-radius:12px;padding:12px 16px;margin:16px 0}
.callout.info{background:var(--accent-soft);border-left-color:var(--accent)}
.callout strong{display:block}
section.s{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:24px;margin-bottom:22px}
section.s>h2{font-size:26px;line-height:1.2;margin-bottom:6px;display:flex;gap:12px;align-items:baseline}
section.s>h2 .n{font-size:15px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 10px;flex:none}
section.s>.lede{color:var(--ink-2);margin:0 0 16px;max-width:62ch}
.step{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:start;padding:18px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.step h3{font-size:19px;margin-bottom:6px}
.step ol,.step ul{margin:6px 0;padding-left:22px}
.step li{margin:4px 0}
.step p{margin:6px 0}
figure{margin:0;justify-self:center}
figure img{display:block;width:240px;max-width:100%;height:auto;border-radius:22px;border:6px solid #241b33;box-shadow:var(--shadow);background:#241b33}
figcaption{font-size:13.5px;color:var(--ink-2);text-align:center;margin-top:8px;max-width:240px}
.btnref{display:inline-block;font-weight:700;background:var(--surface-2);border-radius:8px;padding:0 7px;white-space:nowrap}
.btnref.p{background:var(--accent);color:var(--accent-ink)}
.btnref.r{background:var(--record);color:#fff}
kbd{font:inherit;font-weight:700}
.tip{font-size:15.5px;color:var(--ink-2)}
.tip::before{content:"Tip: ";font-weight:700;color:var(--ink)}
details.faq{border-top:1px solid var(--line);padding:12px 0}
details.faq:first-of-type{border-top:0}
details.faq summary{cursor:pointer;font-weight:700;font-size:17.5px}
details.faq p{margin:8px 0 0}
footer{color:var(--ink-2);font-size:14px;text-align:center;margin-top:30px}
@media (max-width:860px){
  .layout{grid-template-columns:1fr;gap:16px}
  nav.toc{position:static;max-height:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
  nav.toc details summary{font-weight:700;cursor:pointer;padding:4px 10px}
}
@media (max-width:620px){
  section.s{padding:18px 16px}
  .step{grid-template-columns:1fr;gap:14px}
  figure img{width:220px}
  .top strong{font-size:16px}
}
@media print{.top,nav.toc{display:none}.layout{display:block}section.s{break-inside:avoid-page;box-shadow:none}}
.gate{max-width:560px;margin:48px auto;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:grid;gap:12px;text-align:center}
.gate a{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<header class="top"><div class="in">
  <img src="icon-192.png" alt="" width="34" height="34">
  <strong>User manual</strong>
  <a class="back" href="./">Open the app</a>
</div></header>

<div id="manualRoot"><div class="gate" id="manualGate"><p>Loading the user manual…</p></div></div>
<script src="manual.js"></script>
</body>
</html>
